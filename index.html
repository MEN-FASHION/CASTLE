<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        .header {
            background-color: #0f172a;
            padding: 24px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0,0,0.15);
        }

        .header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            padding: 16px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            background-color: #e2e8f0;
            aspect-ratio: 1 / 1;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item img.loaded {
            opacity: 1;
        }

        .gallery-item:hover {
            opacity: 0.9;
        }

        .gallery-item .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: #fff;
            font-size: 12px;
            padding: 24px 10px 8px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox.active { display: flex; }

        .lightbox img {
            max-width: 92%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 4px;
        }

        .lightbox-caption {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 14px;
            letter-spacing: 1px;
        }

        .lightbox-close {
            position: absolute;
            top: 16px; right: 24px;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            line-height: 1;
            user-select: none;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px; height: 48px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .lightbox-nav:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        .lightbox-spinner {
            position: absolute;
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .lightbox-counter {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 20px; }
            .header p { font-size: 12px; }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 5px;
                padding: 8px;
            }
            .lightbox-nav { width: 38px; height: 38px; font-size: 18px; }
            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
        }
    </style>
</head>

        const gallery = document.getElementById("gallery");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxSpinner = document.getElementById("lightbox-spinner");
        const lightboxCaption = document.getElementById("lightbox-caption");
        const lightboxClose = document.getElementById("lightbox-close");
        const lightboxPrev = document.getElementById("lightbox-prev");
        const lightboxNext = document.getElementById("lightbox-next");
        const lightboxCounter = document.getElementById("lightbox-counter");

        let currentIndex = 0;

        // Render gallery items with data-src (no loading yet)
        images.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "gallery-item";
            div.innerHTML = `
                <img data-src="${item.thumb}" alt="${item.caption}">
                <div class="caption">${item.caption}</div>
            `;
            div.addEventListener("click", () => openLightbox(index));
            gallery.appendChild(div);
        });

        document.getElementById("image-count").textContent = images.length;

        // Lazy load thumbnails with IntersectionObserver
        const imgObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const src = img.getAttribute("data-src");
                    if (src) {
                        img.onload = () => img.classList.add("loaded");
                        img.src = src;
                        img.removeAttribute("data-src");
                    }
                    imgObserver.unobserve(img);
                }
            });
        }, {
            rootMargin: "300px 0px",
            threshold: 0.01
        });

        document.querySelectorAll(".gallery-item img").forEach(img => imgObserver.observe(img));

        function openLightbox(index) {
            currentIndex = index;
            lightbox.classList.add("active");
            updateLightbox();
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            lightboxImg.src = "";
        }

        function updateLightbox() {
            const item = images[currentIndex];
            lightboxSpinner.style.display = "block";
            lightboxImg.style.display = "none";
            lightboxCaption.textContent = item.caption;
            lightboxCounter.textContent = `${currentIndex + 1} / ${images.length}`;

            const temp = new Image();
            temp.onload = () => {
                lightboxImg.src = item.full;
                lightboxImg.alt = item.caption;
                lightboxSpinner.style.display = "none";
                lightboxImg.style.display = "block";
            };
            temp.src = item.full;
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateLightbox();
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % images.length;
            updateLightbox();
        }

        lightboxClose.addEventListener("click", closeLightbox);
        lightboxPrev.addEventListener("click", (e) => { e.stopPropagation(); showPrev(); });
        lightboxNext.addEventListener("click", (e) => { e.stopPropagation(); showNext(); });

        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener("keydown", (e) => {
            if (!lightbox.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") showPrev();
            if (e.key === "ArrowRight") showNext();
        });

        let touchStartX = 0;
        lightbox.addEventListener("touchstart", (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        lightbox.addEventListener("touchend", (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) showNext(); else showPrev();
            }
        });
    </script>
